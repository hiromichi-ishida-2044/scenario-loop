<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151513">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>シナリオ進化ループ</title>
<style>
:root{ color-scheme: light;
  --plane:#f4f3ef; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --ring:rgba(11,11,11,.10); --crit:#d03b3b; }
@media (prefers-color-scheme: dark){ :root{ color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --ring:rgba(255,255,255,.10); --crit:#e66767; } }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; background:var(--plane); color:var(--ink); display:grid; place-items:center;
  padding:24px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left));
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.7;}
.box{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--ring);
  border-radius:16px; padding:26px 22px; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.07);}
h1{font-size:17px; margin:0 0 4px; letter-spacing:.01em;}
.sub{font-size:12.5px; color:var(--ink-3); margin:0 0 20px;}
label{display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:6px;}
input[type=password]{width:100%; min-height:48px; padding:0 14px; font:inherit; font-size:16px;
  border:1px solid var(--ring); border-radius:11px; background:var(--plane); color:var(--ink);}
input[type=password]:focus{outline:2px solid var(--ink-3); outline-offset:1px;}
.remember{display:flex; align-items:center; gap:9px; margin:14px 0 0; font-size:13px; color:var(--ink-2);
  min-height:44px; cursor:pointer;}
.remember input{width:19px; height:19px; accent-color:var(--ink);}
button{width:100%; min-height:48px; margin-top:14px; border:0; border-radius:11px;
  background:var(--ink); color:var(--plane); font:inherit; font-size:15px; font-weight:700; cursor:pointer;}
button:disabled{opacity:.5; cursor:default;}
.msg{margin:14px 0 0; font-size:13px; min-height:1.5em;}
.msg.err{color:var(--crit);}
.msg.wait{color:var(--ink-3);}
.foot{margin:18px 0 0; padding-top:14px; border-top:1px solid var(--ring);
  font-size:11.5px; color:var(--ink-3); line-height:1.65;}
</style>
</head>
<body>
<div class="box">
  <h1>シナリオ進化ループ</h1>
  <p class="sub">このページは暗号化されています。パスワードを入れてください。</p>
  <form id="f">
    <label for="pw">パスワード</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <label class="remember"><input id="rm" type="checkbox" checked>この端末では次回から省略する</label>
    <button id="go" type="submit">開く</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="foot">中身は AES-256-GCM で暗号化されており、パスワードなしでは読めません。
  復号はこの端末の中だけで行われ、入力したパスワードがどこかへ送られることはありません。</p>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById("msg");
const KEYNAME = "scenario-loop-pw";

async function unlock(pw, quiet){
  const L = window.LOCKED;
  msg.className = "msg wait";
  msg.textContent = "開いています…";
  document.getElementById("go").disabled = true;
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
      {name:"PBKDF2"}, false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(L.salt), iterations:L.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(L.nonce)}, key, b64(L.data));
    const html = new TextDecoder().decode(buf);
    if(document.getElementById("rm").checked){
      try{ localStorage.setItem(KEYNAME, pw); }catch(e){}
    }else{
      try{ localStorage.removeItem(KEYNAME); }catch(e){}
    }
    document.open("text/html", "replace");
    document.write(html);
    document.close();
  }catch(e){
    try{ localStorage.removeItem(KEYNAME); }catch(_){}
    document.getElementById("go").disabled = false;
    msg.className = "msg err";
    msg.textContent = quiet ? "保存されていたパスワードが使えませんでした。入れ直してください。"
                            : "パスワードが違います。";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
}

document.getElementById("f").addEventListener("submit", e=>{
  e.preventDefault();
  unlock(document.getElementById("pw").value, false);
});

(function(){
  let saved = null;
  try{ saved = localStorage.getItem(KEYNAME); }catch(e){}
  if(saved) unlock(saved, true);
  else document.getElementById("pw").focus();
})();
</script>
